name: Release

# A release is published whenever the version in gradle.properties has no tag yet:
# bumping bpdf.versionName (with a matching CHANGELOG section) on a pushed branch cuts the
# release and this workflow creates the tag. Pushing a v* tag manually works too.
on:
  push:
    branches:
      - main
      - 'ccr-*'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(grep '^bpdf.versionName=' gradle.properties | cut -d= -f2)"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" != "tag" ] && git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "${TAG} is already released; nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.tag.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.tag.outputs.skip != 'true'
      - uses: android-actions/setup-android@v3
        if: steps.tag.outputs.skip != 'true'
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - name: Run unit tests
        if: steps.tag.outputs.skip != 'true'
        run: ./gradlew --max-workers=2 testDebugUnitTest
      - name: Decode signing keystore
        if: steps.tag.outputs.skip != 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "BPDF_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "BPDF_KEYSTORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "BPDF_KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "BPDF_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "No signing keystore secret; release APK will be debug-signed."
          fi
      - name: Build release APK
        if: steps.tag.outputs.skip != 'true'
        run: ./gradlew --max-workers=2 assembleRelease
      - name: Prepare asset and release notes
        if: steps.tag.outputs.skip != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          cp app/build/outputs/apk/release/*.apk "b-pdf-${TAG}.apk"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "Release ${TAG}" > release-notes.md; fi
      - name: Publish GitHub Release
        if: steps.tag.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: b PDF ${{ steps.tag.outputs.tag }}
          files: b-pdf-${{ steps.tag.outputs.tag }}.apk
          body_path: release-notes.md
