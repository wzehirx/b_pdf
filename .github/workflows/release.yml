name: Release

# A release is published whenever the version in gradle.properties has no tag yet:
# bumping bpdf.versionName (with a matching CHANGELOG section) on a pushed branch cuts the
# release and this workflow creates the tag. Pushing a v* tag manually works too.
on:
  push:
    branches:
      - main
      - 'ccr-*'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# Pushes in quick succession must not race to publish the same tag: run one at a time,
# so later runs see the tag the earlier one created and skip.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve release tag
        id: tag
        run: |
          VERSION_TAG="v$(grep '^bpdf.versionName=' gradle.properties | cut -d= -f2)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            if [ "${TAG}" != "${VERSION_TAG}" ]; then
              echo "::error::Tag ${TAG} does not match bpdf.versionName in gradle.properties (${VERSION_TAG}). Fix the version or the tag."
              exit 1
            fi
          else
            TAG="${VERSION_TAG}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" != "tag" ] && git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "${TAG} is already released; nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check signing secrets
        if: steps.tag.outputs.skip != 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          # A release signed with a throwaway debug key could never be updated: the next release would
          # have another key and Android would refuse to install it over this one. Refuse to publish.
          missing=""
          [ -n "$SIGNING_KEYSTORE_BASE64" ] || missing="$missing SIGNING_KEYSTORE_BASE64"
          [ -n "$SIGNING_STORE_PASSWORD" ] || missing="$missing SIGNING_STORE_PASSWORD"
          [ -n "$SIGNING_KEY_ALIAS" ] || missing="$missing SIGNING_KEY_ALIAS"
          [ -n "$SIGNING_KEY_PASSWORD" ] || missing="$missing SIGNING_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Release signing is not configured. Set these four repository secrets (Settings > Secrets and variables > Actions) and run the workflow again: SIGNING_KEYSTORE_BASE64 (the keystore file, base64 encoded), SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD. Missing:${missing}. Publishing a debug-signed release is refused because users could never update from it."
            exit 1
          fi
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "BPDF_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        if: steps.tag.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.tag.outputs.skip != 'true'
      - uses: android-actions/setup-android@v3
        if: steps.tag.outputs.skip != 'true'
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - name: Run unit tests
        if: steps.tag.outputs.skip != 'true'
        run: ./gradlew --max-workers=2 testDebugUnitTest
      - name: Build release APK
        if: steps.tag.outputs.skip != 'true'
        # The secrets only ever reach the build as environment variables, never inside a script text.
        env:
          BPDF_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          BPDF_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          BPDF_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --max-workers=2 assembleRelease
      - name: Verify the signing certificate
        if: steps.tag.outputs.skip != 'true'
        env:
          # Optional repository variable: SHA-256 of the release certificate. When set, a wrong key fails the job.
          EXPECTED_CERT_SHA256: ${{ vars.BPDF_CERT_SHA256 }}
        run: |
          APK="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          CERTS="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK")"
          echo "$CERTS"
          if [ -n "$EXPECTED_CERT_SHA256" ]; then
            ACTUAL="$(printf '%s\n' "$CERTS" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)"
            WANTED="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')"
            if [ "$ACTUAL" != "$WANTED" ]; then
              echo "::error::The APK is signed with certificate ${ACTUAL}, expected ${WANTED} (repository variable BPDF_CERT_SHA256)."
              exit 1
            fi
          fi
      - name: Prepare asset and release notes
        if: steps.tag.outputs.skip != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          cp app/build/outputs/apk/release/*.apk "b-pdf-${TAG}.apk"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "Release ${TAG}" > release-notes.md; fi
      - name: Publish GitHub Release
        if: steps.tag.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: b PDF ${{ steps.tag.outputs.tag }}
          files: b-pdf-${{ steps.tag.outputs.tag }}.apk
          body_path: release-notes.md
